[project]
name = "pingpong-study"
version = "7.0.4"
description = "An app to support the PingPong College RCT study."
readme = "README.md"
requires-python = ">= 3.11, <4.0.0"
authors = [
    { name = "Evangelos Kassos", email = "github@evangeloskassos.com" }
]
license = "MIT"
dependencies = [
    "aiohttp~=3.14.3",
    "aiosmtplib~=5.1.2",
    "arrow ~= 1.4.0",
    "azure-communication-email ~= 1.1.0",
    "click>=8.4.2,<8.6.0",
    "dotenv ~= 0.9.9",
    "fastapi[standard]~=0.141.1",
    "opentelemetry-sdk~=1.44.0",
    "pyairtable~=3.4.2",
    "pydantic~=2.13.4",
    "pydantic-settings~=2.15.0",
    "pyjwt~=2.13.0",
    "requests~=2.34.2",
    "sentry-sdk>=2.68,<2.70",
    "uvicorn~=0.52.3",
]

[dependency-groups]
dev = [
    "deptry~=0.25.1",
    "pre-commit~=4.6.2",
]

local-scripts-qualtrics = [
    "selenium~=4.47.0",
]

[tool.deptry]
known_first_party = ["pingpong"]

[tool.uv]
override-dependencies = ["pygments ~= 2.20.0"]
